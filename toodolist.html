
<!DOCTYPE html>
<html>
<head>
<title>To-Do List</title>
<style>
body {
    font-family: Arial;
    background: #eef2ff;
    text-align: center;
    padding: 40px;
}
.container {
    background: white;
    padding: 20px;
    border-radius: 12px;
    max-width: 300px;
    margin: auto;
}
input, button {
    padding: 8px;
    border: none;
    border-radius: 5px;
}
button {
    background: #2563eb;
    color: white;
    cursor: pointer;
}
li {
    margin: 10px;
    text-align: left;
    color: #1e40af;
    cursor: pointer;
}
.done { text-decoration: line-through; }
</style>
</head>
<body>
<div class="container">
<h2>My To-Do List</h2>
<input id="task" placeholder="Enter task">
<button onclick="addTask()">Add</button>
<ul id="list"></ul>
</div>

<script>
function addTask() {
    let input = document.getElementById("task");
    if (input.value.trim() === "") return;

    let li = document.createElement("li");
    li.textContent = input.value;
    li.onclick = () => li.classList.toggle("done");

    let del = document.createElement("button");
    del.textContent = "X";
    del.onclick = (e) => {
        e.stopPropagation();
        li.remove();
    };

    li.append(" ", del);
    document.getElementById("list").appendChild(li);
    input.value = "";
}
</script>
</body>
</html>
